<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harness Studio</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1e293b;
        --line: #dfe5ec;
        --muted: #64748b;
        --faint: #94a3b8;
        --panel: #fff;
        --soft: #f6f8fa;
        --lime: #6c9f25;
        --blue: #376fcb;
        --amber: #b96918;
        --violet: #7753b5;
        --purple: var(--violet);
      }
      * { box-sizing: border-box; }
      html, body { max-width: 100%; overflow-x: clip; }
      body { color: var(--ink); background: #f3f5f7; font: 14px/1.45 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; }
      main { width: 100%; max-width: 1320px; margin: 0 auto; padding: .65rem .8rem 2rem; }
      main.experiment-mode { max-width: none; min-height: 100vh; margin: 0; padding: 0; background: #fff; }
      main > header { min-height: 38px; display: flex; align-items: center; gap: .9rem; flex-wrap: wrap; margin-bottom: .55rem; }
      main > header h1 { margin: 0; font-size: 1rem; letter-spacing: -.01em; }
      .studio-tabs { padding: 2px; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); border: 1px solid var(--line); border-radius: 8px; background: #fff; }
      .studio-tabs button { min-height: 32px; margin: 0; border: 0; border-radius: 6px; padding: .35rem .7rem; color: var(--muted); background: transparent; cursor: pointer; font-size: 11px; }
      .studio-tabs button.active { color: #fff; background: #263244; box-shadow: 0 3px 8px rgba(15,23,42,.14); font-weight: 700; }
      .run-controls { padding: .8rem; display: flex; gap: .75rem; align-items: stretch; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: 0 10px 28px rgba(15,23,42,.04); }
      .run-controls textarea { min-height: 84px; flex: 1 1 24rem; min-width: 0; resize: vertical; border: 1px solid #cad2dc; border-radius: 8px; font: inherit; padding: .65rem .75rem; }
      .run-controls button { min-width: 112px; border: 0; border-radius: 8px; padding: .6rem .9rem; color: #fff; background: #376fcb; cursor: pointer; font-weight: 700; }
      .run-controls button:disabled { cursor: wait; opacity: .62; }
      .status-line { color: #555; }
      .run-status { display: flex; align-items: center; gap: .35rem; overflow-wrap: anywhere; }
      .status-dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: #9aa3ae; }
      .status-dot.status-running { background: #b27627; box-shadow: 0 0 0 4px #fff1db; }
      .status-dot.status-finished { background: #258675; }
      .status-dot.status-error { background: #b44343; }
      .warning { color: #9a6700; }
      .error { color: #c0392b; }
      .muted { color: #888; font-size: .85rem; }
      .activity-panel { overflow: hidden; border: 1px solid var(--line); border-radius: 13px; background: var(--panel); box-shadow: 0 10px 28px rgba(15,23,42,.045); }
      .activity-panel-head { min-height: 58px; padding: .65rem .85rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; border-bottom: 1px solid var(--line); background: #fbfcfd; }
      .activity-panel-head small { color: var(--purple); font-size: .68rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
      .activity-panel-head h2 { margin: .05rem 0 0; font-size: 1rem; }
      .activity-panel-head > span { color: var(--muted); font-size: .78rem; }
      .timeline { padding: .8rem; display: grid; gap: .65rem; }
      .activity-empty { margin: 0; padding: 1.5rem .75rem; color: #7a8492; text-align: center; }
      .timeline .entry { border-left: 3px solid #7a8797; border-radius: 0 8px 8px 0; padding: .45rem .7rem; background: #f8fafb; }
      .timeline .entry pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: .2rem 0; font: inherit; }
      .entry-tag { font-size: .75rem; text-transform: uppercase; color: #888; margin-right: .5rem; }
      .tool-card { overflow: hidden; border: 1px solid #ded7ef; border-top: 3px solid var(--purple); border-radius: 10px; background: #fff; }
      .tool-card > summary { min-height: 58px; padding: .55rem .7rem; display: grid; grid-template-columns: 28px minmax(0,1fr) auto 18px; gap: .55rem; align-items: center; cursor: pointer; list-style: none; }
      .tool-card > summary::-webkit-details-marker { display: none; }
      .tool-card > summary:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
      .tool-icon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 7px; color: #5d4691; background: #f0ebfa; font-size: 1.1rem; font-weight: 800; }
      .tool-title { min-width: 0; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 0 .55rem; align-items: baseline; }
      .tool-title small { grid-column: 1/-1; color: #8676a9; font-size: .62rem; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
      .tool-title strong { font-size: .9rem; }
      .tool-title code { overflow: hidden; color: #748091; text-overflow: ellipsis; white-space: nowrap; font-size: .73rem; }
      .tool-status { border-radius: 999px; padding: .18rem .48rem; color: #5d4691; background: #f0ebfa; font-size: .66rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
      .status-running .tool-status, .status-preparing .tool-status { color: #805413; background: #fff1db; }
      .status-failed { border-color: #efc7c4; border-top-color: #b44343; }
      .status-failed .tool-status, .status-interrupted .tool-status { color: #8f2f2f; background: #fde8e7; }
      .status-result-unavailable .tool-status { color: #596579; background: #edf0f3; }
      .tool-chevron { color: #8992a0; transition: transform .12s ease; }
      .tool-card[open] .tool-chevron { transform: rotate(180deg); }
      .tool-detail { border-top: 1px solid #ece8f4; background: #fcfbfe; }
      .tool-detail section { padding: .7rem .8rem; border-bottom: 1px solid #ece8f4; }
      .tool-detail h4 { margin: 0 0 .4rem; color: #687383; font-size: .66rem; text-transform: uppercase; letter-spacing: .07em; }
      .highlighted-code { margin: 0; overflow: auto; color: #27334a; background: #fff; white-space: pre; tab-size: 2; font: 13px/1.55 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace; }
      .highlighted-code code, .highlighted-code-line { font: inherit; }
      .tool-detail .highlighted-code { max-height: 260px; border: 1px solid #e3deed; border-radius: 7px; padding: .6rem; white-space: pre-wrap; overflow-wrap: anywhere; }
      .tool-empty { margin: 0; color: #7a8492; font-size: .78rem; }
      .tool-notice { margin: 0 0 .45rem; color: #8a5a15; font-size: .72rem; font-weight: 650; }
      .tool-detail footer { padding: .5rem .8rem; display: flex; gap: .6rem; color: #8a94a2; font-size: .68rem; }
      .tool-detail footer code { min-width: 0; overflow: hidden; color: #596579; text-overflow: ellipsis; white-space: nowrap; }
      .table-scroll { width: 100%; overflow-x: auto; margin: .8rem 0; }
      .table-scroll:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
      table { border-collapse: collapse; min-width: max-content; }
      th, td { border: 1px solid #bbb; padding: .4rem .6rem; text-align: left; }
      .verdict-accept { color: #1a7f37; }
      .verdict-reject, .verdict-infrastructure_error { color: #c0392b; }
      .verdict-need_more_work { color: #9a6700; }
      .verdict-insufficient_evidence { color: #57606a; }
      .experiment-shell { min-height: 100vh; display: grid; grid-template-columns: 230px minmax(0,1fr); background: #fff; }
      .experiment-shell.rail-collapsed { grid-template-columns: 46px minmax(0,1fr); }
      .experiment-rail { position: sticky; top: 0; z-index: 4; height: 100vh; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: #fafbfc; }
      .experiment-brand { min-height: 66px; position: relative; padding: 15px 42px 13px 17px; border-bottom: 1px solid var(--line); }
      .experiment-brand strong { display: block; font-size: 17px; letter-spacing: -.025em; }
      .experiment-brand span { display: block; color: var(--muted); font-size: 10px; }
      .rail-toggle { position: absolute; top: 14px; right: 8px; border: 1px solid #d8dee6; border-radius: 6px; padding: 4px 6px; color: #556274; background: #fff; cursor: pointer; font-size: 8px; font-weight: 700; }
      .rail-toggle .show-label { display: none; }
      .rail-collapsed .experiment-brand { min-height: 100vh; padding: 9px 5px; border-bottom: 0; }
      .rail-collapsed .brand-copy, .rail-collapsed .rail-content, .rail-collapsed .rail-footer { display: none; }
      .rail-collapsed .rail-toggle { position: sticky; top: 9px; width: 34px; min-height: 104px; margin: 0 auto; writing-mode: vertical-rl; }
      .rail-collapsed .rail-toggle .hide-label { display: none; }
      .rail-collapsed .rail-toggle .show-label { display: inline; }
      .rail-content { min-height: 0; overflow-y: auto; padding: 0 11px 14px; }
      .experiment-rail .studio-tabs { margin: 13px 3px 11px; }
      .experiment-rail .studio-tabs button { min-height: 29px; padding: 5px 4px; font-size: 9px; }
      .rail-section { padding: 11px 5px; border-top: 1px solid #e8ecf0; }
      .rail-section:first-of-type { border-top: 0; }
      .rail-heading { margin-bottom: 7px; display: flex; justify-content: space-between; align-items: baseline; color: var(--muted); font-size: 8px; text-transform: uppercase; letter-spacing: .07em; }
      .rail-heading strong { color: #465468; font-size: 9px; }
      .checkpoint-section code { display: block; overflow: hidden; color: #305886; text-overflow: ellipsis; white-space: nowrap; font: 700 9px ui-monospace,SFMono-Regular,Menlo,monospace; }
      .rail-section p { margin: 5px 0 0; overflow: hidden; color: var(--muted); font-size: 9px; line-height: 1.45; }
      .checkpoint-section p { text-overflow: ellipsis; white-space: nowrap; }
      .task-section p { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; color: #344155; font-size: 10px; }
      .rail-lanes { margin: 0; padding: 0; display: grid; list-style: none; }
      .rail-lanes li { min-height: 39px; display: grid; grid-template-columns: 8px minmax(0,1fr) auto; gap: 7px; align-items: center; border-top: 1px solid #edf0f3; }
      .rail-lanes li:first-child { border-top: 0; }
      .rail-lane-dot { width: 7px; height: 7px; border-radius: 50%; background: #a2abb7; }
      .rail-lane-dot.status-running, .rail-lane-dot.status-preparing { background: var(--amber); box-shadow: 0 0 0 3px #fff1db; }
      .rail-lane-dot.status-finished, .rail-lane-dot.status-history { background: var(--lime); }
      .rail-lane-dot.status-failed, .rail-lane-dot.status-cancelled { background: #b94040; }
      .rail-lanes strong, .rail-lanes small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .rail-lanes strong { color: #344155; font-size: 10px; }
      .rail-lanes small { margin-top: 1px; color: var(--muted); font-size: 8px; }
      .rail-lanes em { color: var(--muted); font-size: 8px; font-style: normal; }
      .contrast-preview { display: grid; gap: 5px; }
      .contrast-chip { min-width: 0; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 6px; align-items: center; border-left: 3px solid #a8b2bf; padding: 5px 6px; color: var(--muted); background: #f3f5f7; font-size: 8px; }
      .contrast-chip b { overflow: hidden; color: #465468; text-overflow: ellipsis; white-space: nowrap; font-size: 9px; }
      .contrast-chip small { font-size: 8px; }
      .contrast-chip.mode-attributable { border-left-color: var(--lime); background: #f5faee; }
      .contrast-chip.mode-descriptive { border-left-color: var(--amber); background: #fff8eb; }
      .rail-footer { margin-top: auto; padding: 10px 14px 13px; border-top: 1px solid var(--line); background: #fafbfc; }
      .rail-footer > div { margin-bottom: 8px; display: flex; justify-content: space-between; gap: 6px; color: var(--muted); font-size: 8px; }
      .rail-footer strong { color: #465468; font-size: 9px; }
      .rail-footer button { width: 100%; min-height: 30px; border: 1px solid #2f5fa8; border-radius: 7px; padding: 5px 8px; color: #fff; background: var(--blue); cursor: pointer; font-size: 10px; font-weight: 700; }
      .rail-footer button.secondary { border-color: #cfd6de; color: #465468; background: #fff; }
      .rail-footer .rail-actions { margin: 0; display: grid; grid-template-columns: .75fr 1fr; gap: 6px; }
      .rail-footer .rail-actions button.secondary { border-color: #cfd6de; color: #465468; background: #fff; }
      .experiment-workspace { min-width: 0; }
      .experiment-workspace-header { min-height: 42px; position: sticky; top: 0; z-index: 3; padding: 5px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); background: #fff; }
      .workspace-breadcrumb { min-width: 0; flex: 1; display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 10px; }
      .workspace-breadcrumb span, .workspace-breadcrumb strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .workspace-breadcrumb i { color: #b1bac6; font-style: normal; }
      .workspace-breadcrumb strong { color: var(--ink); font-size: 11px; }
      .workspace-breadcrumb button { border: 0; padding: 0; color: #376fcb; background: transparent; cursor: pointer; font: inherit; }
      .workspace-breadcrumb button:focus-visible { outline: 2px solid #3478c8; outline-offset: 2px; }
      .workspace-header-meta, .scope-metrics, .metric { display: flex; align-items: center; }
      .workspace-header-meta { flex: none; gap: 9px; }
      .metric { gap: 3px; padding: 0 7px; border-left: 1px solid var(--line); white-space: nowrap; }
      .metric strong { color: var(--ink); font-size: 11px; line-height: 1; }
      .metric span { color: var(--muted); font-size: 8px; text-transform: uppercase; letter-spacing: .04em; }
      .window-badge { max-width: 150px; overflow: hidden; border: 1px solid var(--line); border-radius: 999px; padding: 4px 8px; color: var(--muted); background: #fff; text-overflow: ellipsis; white-space: nowrap; font: 9px ui-monospace,SFMono-Regular,Menlo,monospace; }
      .experiment-workspace-scroll { padding: 10px 12px 32px; overflow-x: auto; }
      .experiment-workbench { min-width: 730px; overflow: hidden; border: 1px solid var(--line); border-radius: 13px; background: #fff; box-shadow: 0 10px 28px rgba(15,23,42,.045); }
      .experiment-workbench-head { min-height: 52px; padding: 7px 12px; display: flex; align-items: center; justify-content: space-between; gap: 14px; border-bottom: 1px solid var(--line); background: #fbfcfd; }
      .experiment-workbench-head > div { min-width: 0; }
      .experiment-workbench-head small, .section-heading small, .lane-column header small, .inspector-heading small { color: var(--muted); font-size: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; }
      .experiment-workbench-head h2 { margin: 1px 0 0; overflow: hidden; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
      .experiment-workbench-head p { margin: 1px 0 0; color: var(--muted); font-size: 8px; }
      .live-state { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 7px; color: var(--muted); background: #fff; font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
      .live-state i { width: 6px; height: 6px; border-radius: 50%; background: var(--lime); }
      .live-state.running i { background: var(--amber); box-shadow: 0 0 0 3px #fff1db; }
      .trace-matrix { min-width: 730px; display: grid; grid-template-columns: repeat(3, minmax(243px,1fr)); overflow: visible; }
      .trace-matrix:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
      .lane-column { min-width: 0; overflow: hidden; border-right: 1px solid var(--line); background: #fff; }
      .lane-column:last-child { border-right: 0; }
      .lane-column > header { min-height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 7px; padding: 5px 9px; border-bottom: 1px solid var(--line); background: #fff; }
      .lane-title { min-width: 0; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 0 5px; align-items: baseline; }
      .lane-title small { grid-column: 1/-1; }
      .lane-title h3 { margin: 0; font-size: 10px; }
      .lane-title > span { min-width: 0; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; font-size: 8px; }
      .lane-status, .relation, .result-status { display: inline-flex; width: max-content; border-radius: 999px; padding: 2px 5px; font-size: 7px; font-weight: 800; text-transform: uppercase; letter-spacing: .035em; }
      .lane-status { color: #596579; background: #edf0f3; }
      .lane-status-running, .lane-status-preparing { color: #805413; background: #fff1db; }
      .lane-status-finished, .lane-status-history { color: #39700d; background: #edf6df; }
      .lane-status-failed, .lane-status-cancelled { color: #8f2f2f; background: #fff0f0; }
      .lane-relation { min-height: 27px; display: flex; align-items: center; gap: 5px; padding: 4px 9px; border-bottom: 1px solid #edf0f3; background: #fbfcfd; }
      .lane-relation small { min-width: 0; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; font-size: 8px; }
      .relation-exact { color: #39700d; background: #edf6df; }
      .relation-same-resource { color: #2358a0; background: #eaf2ff; }
      .relation-same-tool { color: #5b4693; background: #f2ecfb; }
      .relation-none { color: #5d6675; background: #eef1f4; }
      .tool-trace { min-height: 252px; height: min(49vh, 420px); overflow-y: auto; margin: 0; padding: 0; list-style: none; }
      .tool-trace li { min-width: 0; border-bottom: 1px solid #edf0f3; }
      .tool-trace button { width: 100%; min-height: 29px; display: grid; grid-template-columns: 22px minmax(0,1fr) auto; gap: 5px; align-items: center; border: 0; border-left: 3px solid transparent; padding: 3px 7px 3px 5px; color: inherit; background: #fff; text-align: left; cursor: pointer; }
      .tool-trace button:hover { background: var(--soft); }
      .tool-trace button:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
      .tool-trace button.related { border-left-color: var(--blue); background: #f6f9fe; }
      .tool-trace button.selected { border-left-color: var(--violet); background: #f5f1fb; box-shadow: inset 0 0 0 1px #ded3ef; }
      .tool-sequence { color: #8b95a3; font: 8px ui-monospace,SFMono-Regular,Menlo,monospace; }
      .tool-summary { min-width: 0; display: flex; align-items: baseline; gap: 6px; }
      .tool-summary strong { flex: none; font-size: 9px; line-height: 1.1; }
      .tool-summary small { min-width: 0; overflow: hidden; color: #7b8695; text-overflow: ellipsis; white-space: nowrap; font: 8px ui-monospace,SFMono-Regular,Menlo,monospace; }
      .call-status { color: #7a8492; font-size: 7px; text-transform: uppercase; }
      .call-status-failed { color: #b44343; }
      .call-status-running { color: #9a6700; }
      .trace-empty { padding: 18px 9px; color: #8a94a2; font-size: 9px; }
      .lane-detail { margin: 0; padding: 6px 9px; border-top: 1px solid #edf0f3; color: #9a3a35; background: #fff8f7; font-size: 9px; }
      .selection-inspector, .contrast-results { min-width: 0; display: grid; grid-template-columns: 105px minmax(0,1fr); gap: 7px; align-items: center; padding: 7px 9px; border-top: 1px solid var(--line); background: #fbfcfd; }
      .inspector-heading, .section-heading { display: grid; gap: 1px; }
      .inspector-heading strong, .section-heading h3 { margin: 0; font-size: 9px; }
      .chain-grid, .result-grid { min-width: 0; display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 7px; }
      .chain-lane { min-width: 0; display: grid; align-content: start; gap: 3px; border-left: 1px solid #d8e0e8; padding-left: 7px; }
      .chain-lane > div { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
      .chain-lane > div > strong { font-size: 8px; }
      .chain-lane > p { margin: 3px 0; color: #8a94a2; font-size: 8px; }
      .chain-lane ol { margin: 0; padding: 0; min-width: 0; display: flex; gap: 3px; list-style: none; }
      .chain-lane li { min-width: 0; flex: 1 1 0; display: grid; border-left: 2px solid #ccd3dc; padding: 2px 4px; color: #687383; background: #fff; font-size: 7px; }
      .chain-lane li.chain-selected { border-left-color: var(--violet); color: #3f345a; background: #f5f1fb; }
      .chain-lane li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: ui-monospace,SFMono-Regular,Menlo,monospace; }
      .contrast-results { background: #fff; }
      .result-card { min-width: 0; display: grid; grid-template-columns: auto auto minmax(0,1fr); gap: 2px 5px; align-items: center; border-left: 1px solid #d8e0e8; padding-left: 7px; }
      .result-card > strong { font-size: 8px; }
      .result-card > span:not(.result-status) { overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; font-size: 7px; }
      .result-card small { grid-column: 1/-1; overflow: hidden; color: #687383; text-overflow: ellipsis; white-space: nowrap; font-size: 7px; }
      .result-status { color: #596579; background: #edf0f3; }
      .status-accept { color: #39700d; background: #edf6df; }
      .status-reject, .status-infrastructure_error { color: #8f2f2f; background: #fff0f0; }
      .status-descriptive, .status-need_more_work, .status-insufficient_evidence { color: #8a4b10; background: #fff4df; }
      @media (max-width: 600px) {
        main { padding: .55rem .55rem 2rem; }
        main.experiment-mode { padding: 0; }
        main > header { gap: .4rem .7rem; }
        .run-controls textarea { flex-basis: 100%; width: 100%; }
      }
      @media (max-width: 760px) {
        .experiment-workspace-header { padding-inline: 9px; }
        .scope-metrics .metric:first-child, .window-badge { display: none; }
        .experiment-workspace-scroll { padding: 8px 8px 24px; }
      }

      /* Checkpoint comparison workbench: role-first, pair-focused, trace-dense. */
      .experiment-brand { min-height: 58px; padding-top: 12px; padding-bottom: 10px; }

      /* Session Debugger: semantic ACP evidence navigation, never Replay transport. */

        --debug-blue: #1769d2;

      .simple-rows li { min-width: 0; min-height: 31px; display: grid; grid-template-columns: 15px minmax(0,1fr) auto; gap: 6px; align-items: center; padding: 5px 7px; border-top: 1px solid #edf0f4; }

      .fact-list { margin: 0; display: grid; gap: 6px; }

      .checkpoint-boundary li { min-height: 38px; display: grid; grid-template-columns: 15px minmax(0,1fr); gap: 7px; align-items: center; padding: 6px 7px; border-top: 1px solid #edf0f4; color: #b6791f; }

      .checkpoint-boundary small { color: #828c9c; font-size: 7px; }
      .test-history li { min-height: 43px; display: grid; grid-template-columns: 16px minmax(0,1fr) auto; gap: 7px; align-items: center; padding: 6px 7px; border-top: 1px solid #edf0f4; color: #bb4047; }
      .test-history li.passed { color: #19845d; }
      .test-history li.selected { background: #f1f6ff; box-shadow: inset 2px 0 #1769d2; }
      .test-history li span { display: grid; }
      .test-history strong { color: #465269; font-size: 8px; }
      .test-history small, .test-history time { color: #818b9b; font-size: 7px; }
      .terminal-card { overflow: hidden; border: 1px solid #dfe4eb; border-radius: 6px; background: #172033; }
      .terminal-card > header { min-height: 31px; display: grid; grid-template-columns: 15px minmax(0,1fr) auto; gap: 6px; align-items: center; padding: 5px 7px; color: #dce6f4; border-bottom: 1px solid #2c374a; }

      .plan-progress li.done { color: #19845d; }
      .plan-progress li.current { color: #1769d2; }

      .plan-progress p { margin: 1px 0 0; color: #596579; font-size: 8px; }
      .evidence-links li { min-height: 48px; display: grid; grid-template-columns: 58px minmax(0,1fr); gap: 7px; align-items: start; padding: 7px; border-top: 1px solid #edf0f4; }

      .evidence-badge.exact { color: #176d50; background: #e7f6ef; }
      .evidence-badge.correlated { color: #2f61a5; background: #eaf2ff; }
      .evidence-badge.inferred { color: #866019; background: #fff3d8; }
      .raw-acp { display: grid; gap: 9px; }
      .raw-acp dl { margin: 0; display: grid; gap: 5px; }
      .raw-acp dl div { display: grid; grid-template-columns: 70px minmax(0,1fr); gap: 7px; }
      .raw-acp dt { color: #7e899a; font-size: 7px; }
      .raw-acp dd { min-width: 0; margin: 0; overflow: hidden; color: #465269; text-overflow: ellipsis; white-space: nowrap; font: 7px ui-monospace,SFMono-Regular,Menlo,monospace; }
      .raw-acp .highlighted-code { max-height: 320px; border: 1px solid #dfe4eb; border-radius: 6px; padding: 9px 10px; background: #f8fafc; white-space: pre-wrap; overflow-wrap: anywhere; }
      .state-inspector > footer { min-height: 39px; flex: none; padding: 6px 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; border-top: 1px solid var(--debug-line); }
      .state-inspector > footer button { display: flex; align-items: center; justify-content: center; gap: 5px; border: 1px solid #d7dde6; border-radius: 5px; color: #526077; background: #fff; cursor: pointer; font-size: 8px; }

      .timeline-minimap { min-width: 0; z-index: 14; padding: 8px 15px 7px; display: grid; grid-template-rows: 16px 27px 22px; gap: 4px; border-top: 1px solid var(--debug-line); background: #fbfcfe; }
      .timeline-range { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: #7f899a; font-size: 7px; }
      .timeline-range strong { color: #596579; font-size: 8px; }

      .timeline-segment { min-width: 9px; position: relative; flex: 1; border: 0; border-radius: 3px; padding: 0 4px; color: rgba(23,32,51,.7); cursor: pointer; font-size: 7px; }

      .timeline-segment.selected { outline: 2px solid #1769d2; outline-offset: 2px; box-shadow: inset 0 0 0 1px #fff; }
      .timeline-segment > span { overflow: hidden; display: block; text-overflow: ellipsis; white-space: nowrap; }
      .kind-prompt { background: #cdddf7; }
      .kind-plan { background: #9bc4fa; }
      .kind-explore { background: #a9dfc6; }
      .kind-change { background: #cdb7ec; }
      .kind-verify { background: #f2a9ad; }
      .kind-response { background: #f4cc8b; }

      .timeline-legend { overflow: hidden; }
      .timeline-legend > span { display: flex; align-items: center; gap: 3px; text-transform: capitalize; white-space: nowrap; }
      .timeline-legend i { width: 7px; height: 7px; border-radius: 2px; }

      .live-composer-backdrop { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; background: rgba(23,32,51,.28); backdrop-filter: blur(2px); }
      .live-composer { width: min(520px,100%); overflow: hidden; border: 1px solid #d9dfe8; border-radius: 10px; background: #fff; box-shadow: 0 22px 60px rgba(23,32,51,.18); }
      .live-composer > header { min-height: 60px; padding: 11px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #e5e9ef; }
      .live-composer > header small { color: #1769d2; font-size: 8px; font-weight: 800; text-transform: uppercase; }
      .live-composer > header h2 { margin: 2px 0 0; font-size: 14px; }
      .live-composer > header button { border: 0; padding: 3px; color: #778295; background: transparent; cursor: pointer; }
      .live-composer > p { margin: 0; padding: 11px 14px 0; color: #68758a; font-size: 9px; line-height: 1.5; }
      .live-composer textarea { width: calc(100% - 28px); min-height: 120px; margin: 11px 14px; resize: vertical; border: 1px solid #cbd3df; border-radius: 7px; padding: 9px 10px; color: #27334a; }
      .live-composer > footer { min-height: 52px; padding: 9px 14px; display: flex; align-items: center; justify-content: flex-end; gap: 7px; border-top: 1px solid #e5e9ef; background: #fafbfd; }
      .live-composer > footer button { min-height: 32px; display: flex; align-items: center; gap: 5px; border: 1px solid #d7dde6; border-radius: 6px; padding: 5px 10px; color: #526077; background: #fff; cursor: pointer; }
      .live-composer > footer button.primary { border-color: #1769d2; color: #fff; background: #1769d2; font-weight: 700; }
      .live-composer > footer button:disabled { opacity: .55; cursor: default; }
      .live-session-stage { padding: 2px 9px 24px 34px; }
      .live-session-stage .run-status { min-height: 30px; margin: 0 0 7px; }
      .live-session-stage .warning, .live-session-stage .error { display: flex; align-items: flex-start; gap: 5px; }
      .live-session-stage .activity-panel { border-radius: 7px; box-shadow: none; }
      .live-session-stage .activity-panel-head { min-height: 46px; padding: 7px 9px; }
      .live-session-stage .activity-panel-head small { font-size: 7px; }
      .live-session-stage .activity-panel-head h2 { font-size: 11px; }
      .live-session-stage .timeline { padding: 8px; gap: 7px; }
      .live-run-result { margin-top: 8px; border: 1px solid #dce2ea; border-radius: 6px; padding: 7px 9px; background: #fff; }
      .live-run-result pre { overflow: auto; font-size: 8px; }
      .live-minimap .timeline-track { align-items: stretch; }
      .live-minimap .timeline-segment { display: block; min-width: 12px; }
      .live-track-empty { margin: auto; color: #8791a1; font-size: 8px; }
      .live-observation-bar { min-width: 0; padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--debug-line); color: #4f5d73; background: #f8fafc; }
      .live-observation-bar span { display: flex; align-items: center; gap: 6px; }
      .live-observation-bar strong { color: #667085; font-weight: 600; }
      .timeline-window-note { margin: 0; padding: 7px 10px; border-bottom: 1px solid #e4e9f0; color: #5f6d82; background: #f8fafc; }
      .checkpoint-run.paged-run { display: grid; grid-template-columns: 12px minmax(0,1fr); }
      .checkpoint-run.paged-run .load-more-calls { grid-column: 2; width: max-content; min-height: 28px; margin-top: 7px; border: 1px solid #cfd7e3; border-radius: 5px; padding: 4px 8px; color: #275f9f; background: #fff; cursor: pointer; }
      .checkpoint-run.paged-run .load-more-calls:disabled { color: #7b8798; cursor: wait; }
      .virtual-call-tree { height: 360px; overflow: auto; }
      .virtual-call-spacer { position: relative; width: 100%; }
      .virtual-call-window { position: absolute; inset: 0 0 auto; }
      .virtual-call-tree > .virtual-call-spacer .virtual-phase-row { height: 44px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid #e6eaf0; padding: 0 9px; color: #4d5a70; background: #f6f8fb; }
      .virtual-call-tree > .virtual-call-spacer button { width: 100%; height: 44px; display: grid; grid-template-columns: 31px minmax(0,1fr) auto; gap: 7px; align-items: center; border: 0; border-bottom: 1px solid #edf0f4; padding: 0 9px; color: #455169; background: #fff; text-align: left; cursor: pointer; }
      .virtual-call-tree > .virtual-call-spacer button.selected { color: #174f9d; background: #edf4ff; box-shadow: inset 2px 0 #1769d2; }
      .virtual-live-timeline { height: min(56vh,620px); min-height: 320px; overflow: auto; contain: strict; }
      .virtual-live-spacer { width: 100%; position: relative; }
      .virtual-live-row { width: 100%; position: absolute; top: 0; left: 0; padding-bottom: 7px; }
      .live-tool-group { overflow: hidden; border: 1px solid #dbe2eb; border-left: 3px solid #8d6ac4; border-radius: 0 7px 7px 0; background: #fff; }
      .live-tool-group > summary { min-height: 58px; padding: 9px 11px; display: grid; grid-template-columns: 72px minmax(0,1fr) auto; gap: 8px; align-items: center; cursor: pointer; list-style: none; }
      .live-tool-group > summary::-webkit-details-marker { display: none; }
      .live-tool-group > summary > span { color: #6d4ca0; text-transform: capitalize; }
      .live-tool-group > summary > em { color: #667085; font-style: normal; }
      .live-tool-group > div { padding: 7px; display: grid; gap: 7px; border-top: 1px solid #e3e8ef; background: #f8fafc; }

      /* Readability floor for the dense Studio surfaces. Metadata is allowed
         to step down one level, but never to the 7–9px prototype scale. */
      :is(.debugger-shell,.experiment-shell) { --studio-body-size: 13px; --studio-meta-size: 12px; --studio-action-size: 14px; color: #26344a; font-size: var(--studio-body-size); }
      :is(.debugger-shell,.experiment-shell) :where(p,li,label,input,textarea,select,button,strong,code) { font-size: var(--studio-body-size) !important; }
      :is(.debugger-shell,.experiment-shell) :where(small,time,dt,dd,em) { color: #667085; font-size: var(--studio-meta-size) !important; }
      :is(.debugger-shell,.experiment-shell) :where(.debugger-event-card > header > span,.notebook-viewbar > span,.debugger-session-meta > span,.debugger-runtime-meta > span,.inspector-comparison > span,.timeline-range > span,.timeline-footer span,.call-status,.lane-status,.relation) { color: #667085; font-size: var(--studio-meta-size) !important; }
      :is(.debugger-shell,.experiment-shell) :where(.primary,.new-run,.compare-actions button,.notebook-footer button,.live-composer footer button.primary) { font-size: var(--studio-action-size) !important; }
      :is(.debugger-shell,.experiment-shell) :where(.muted,.inspector-empty,.inspector-note,.trace-empty,.timeline-range,.timeline-footer,.timeline-window-note) { color: #5f6d82; }
      .highlighted-code, .studio-diff-fallback { font-size: 13px; }

      @media (max-width: 1320px) {
        .debugger-grid { grid-template-columns: 220px minmax(0,1fr) 310px; }
        .debugger-shell.tree-collapsed .debugger-grid { grid-template-columns: 0 minmax(0,1fr) 310px; }
        .debugger-shell.inspector-collapsed .debugger-grid { grid-template-columns: 220px minmax(0,1fr) 0; }
        .debugger-runtime-meta > span:not(.connection-dot), .debugger-runtime-meta > i { display: none; }
        .debugger-brand { min-width: 182px; }
      }
      @media (max-width: 1080px) {
        .debugger-topbar { grid-template-columns: auto minmax(170px,1fr) auto; }
        .debugger-runtime-meta { display: none; }
        .debugger-top-actions .studio-tabs { display: none; }
        .debugger-grid { grid-template-columns: 205px minmax(0,1fr) 285px; }
        .debugger-shell.tree-collapsed .debugger-grid { grid-template-columns: 0 minmax(0,1fr) 285px; }
        .debugger-shell.inspector-collapsed .debugger-grid { grid-template-columns: 205px minmax(0,1fr) 0; }
        .execution-group-summary small { display: none; }
      }
      @media (max-width: 900px) {
        .debugger-shell { grid-template-rows: 50px 48px minmax(0,1fr) 80px; }
        .debugger-grid, .debugger-shell.tree-collapsed .debugger-grid, .debugger-shell.inspector-collapsed .debugger-grid, .debugger-shell.tree-collapsed.inspector-collapsed .debugger-grid { grid-template-columns: minmax(0,1fr); }
        .debugger-shell:not(.tree-collapsed) .execution-tree { position: fixed; z-index: 60; top: 98px; bottom: 80px; left: 0; width: min(280px,88vw); display: flex; box-shadow: 18px 0 45px rgba(23,32,51,.15); }
        .debugger-shell:not(.inspector-collapsed) .state-inspector { position: fixed; z-index: 60; top: 98px; right: 0; bottom: 80px; width: min(345px,92vw); display: flex; box-shadow: -18px 0 45px rgba(23,32,51,.15); }
        .timeline-minimap { grid-template-rows: 13px 23px 17px; padding-top: 6px; padding-bottom: 5px; }
        .timeline-segment > span { display: none; }
      }
      @media (max-width: 620px) {
        .debugger-topbar { grid-template-columns: minmax(0,1fr) auto; gap: 8px; padding-inline: 9px; }
        .debugger-brand { min-width: 0; }
        .debugger-brand > span:last-child, .debugger-session-meta { display: none; }
        .debugger-top-actions > button:not(.new-run) span { display: none; }
        .debugger-top-actions > button { padding-inline: 6px; }
        .debugger-toolbar { padding-inline: 8px; gap: 10px; }
        .step-controls button { padding-inline: 7px; }
        .pause-boundary { margin-left: 0; }
        .session-notebook-scroll { padding-inline: 3px; }
        .debugger-event { grid-template-columns: 27px minmax(0,1fr); }
        .diff-grid { grid-template-columns: minmax(310px,1fr) minmax(310px,1fr); overflow-x: auto; }
        .mock-tool-detail { grid-template-columns: 1fr; }
        .mock-tool-detail section { border-right: 0; border-bottom: 1px solid #e1e6ed; }
        .notebook-viewbar > span, .notebook-viewbar button:not(.active) { display: none; }
        .timeline-legend { max-width: 66vw; overflow-x: auto; }
      }
    </style>
