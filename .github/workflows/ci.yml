name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.20.0
          - os: macos-latest
            node: 22.20.0
          - os: windows-latest
            node: 22.20.0
          - os: ubuntu-latest
            node: 24.x
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Run Vitest
        run: npm run test:ci
      - name: Verify Harness DSL generated sources
        run: npm run harness:generated
      - name: Build Harness DSL package
        run: npm run harness:build
      - name: Test Harness DSL package
        run: npm run harness:test
      - name: Upload JUnit test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-node-${{ matrix.node }}
          path: test-results/vitest.junit.xml
          if-no-files-found: error
      - run: npm run pack:verify
